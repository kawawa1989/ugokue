[project]
name = "ugokue-pipeline"
version = "0.1.0"
description = "ugokue のイラストからモデルを作る生成パイプライン"
requires-python = ">=3.11"
dependencies = ["ugokue-format", "numpy>=2.0", "pillow>=11.0"]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[project.scripts]
ugokue-pipeline = "ugokue_pipeline.cli:main"

[tool.uv.sources]
ugokue-format = { path = "../../format/python", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
