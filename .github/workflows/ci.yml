name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-test:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test dotnet/Ugokue.sln

  format-test:
    name: Format tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: astral-sh/setup-uv@v6
      - name: Validate sample
        run: uv run --project format/python ugokue-format validate format/samples/minimal
      - name: Python tests and Python-C# round-trip
        env:
          UGOKUE_REQUIRE_DOTNET: "1"
        run: uv run --project format/python pytest format/python

  unity-license:
    name: Unity license check
    runs-on: ubuntu-latest
    steps:
      - name: Require Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets are missing:$missing"
            exit 1
          fi

  unity-test:
    name: Unity EditMode tests
    needs: unity-license
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-test-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          testMode: editmode
          artifactsPath: artifacts/unity-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts/unity-test

  unity-build:
    name: Unity build (${{ matrix.targetPlatform }})
    needs: unity-license
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneOSX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ugokue
      - name: Pack build
        run: sudo tar -czf ugokue-${{ matrix.targetPlatform }}.tar.gz -C build/${{ matrix.targetPlatform }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ugokue-${{ matrix.targetPlatform }}
          path: ugokue-${{ matrix.targetPlatform }}.tar.gz

  perf-smoke:
    name: Launch and record (${{ matrix.os }})
    needs: unity-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targetPlatform: StandaloneWindows64
            executable: player/ugokue.exe
          - os: macos-latest
            targetPlatform: StandaloneOSX
            executable: player/ugokue.app/Contents/MacOS/ugokue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ugokue-${{ matrix.targetPlatform }}
      - name: Unpack build
        shell: bash
        run: mkdir player && tar -xzf ugokue-${{ matrix.targetPlatform }}.tar.gz -C player
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launch player and verify recording
        run: python .github/scripts/perf_smoke.py ${{ matrix.executable }} --out-dir perf --seconds 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: perf
